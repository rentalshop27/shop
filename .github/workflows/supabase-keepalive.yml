name: Supabase Keepalive

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping-health-function:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_PROJECT_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      SUPABASE_KEEPALIVE_TOKEN: ${{ secrets.SUPABASE_KEEPALIVE_TOKEN }}
    steps:
      - name: Validate configuration
        run: |
          if [ -z "$SUPABASE_PROJECT_URL" ]; then
            echo "Missing repository variable: SUPABASE_PROJECT_URL" >&2
            exit 1
          fi

          if [ -z "$SUPABASE_KEEPALIVE_TOKEN" ]; then
            echo "Missing repository secret: SUPABASE_KEEPALIVE_TOKEN" >&2
            exit 1
          fi

      - name: Ping public health function
        run: |
          endpoint="${SUPABASE_PROJECT_URL%/}/functions/v1/health"
          response_file="$(mktemp)"
          status_code="$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --retry 3 \
            --retry-all-errors \
            --max-time 20 \
            --header "x-keepalive-token: $SUPABASE_KEEPALIVE_TOKEN" \
            "$endpoint")"

          echo "Pinged: $endpoint"
          cat "$response_file"

          if [ "$status_code" != "200" ]; then
            echo "Unexpected status: $status_code" >&2
            exit 1
          fi
